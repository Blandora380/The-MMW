name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin; yes | sdkmanager --licenses >/dev/null; sdkmanager "platforms;android-35" "build-tools;36.1.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0
      - run: gradle -p android :sekaiLive:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/**/build/outputs/apk/debug/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" android/sekai-live/build.gradle)
          APK=$(find android/sekai-live/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" "The-MMW-v${VERSION}.apk"
          gh release create "v${VERSION}" "The-MMW-v${VERSION}.apk" --title "v${VERSION}" --notes "Debug build" || gh release upload "v${VERSION}" "The-MMW-v${VERSION}.apk" --clobber
