name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin; yes | sdkmanager --licenses >/dev/null; sdkmanager "platforms;android-35" "build-tools;36.1.0" "ndk;30.0.16248370" "cmake;4.1.2"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0
      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mmw.keystore"
      - run: gradle -p android :sekaiLive:assembleDebug
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/mmw.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/**/build/outputs/apk/debug/*.apk
